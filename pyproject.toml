[project]
name = "stockassistant"
version = "0.1.0"
description = "Multi-agent pipeline that turns market data into a stock portfolio with weights (paper trading only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11",
    "langgraph>=1.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
stockassistant = "stockassistant.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockassistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# Pipeline state keys are filled stage by stage, and pandas stubs are noisy; see CLAUDE.md.
reportTypedDictNotRequiredAccess = false
